# pike_flood_protection.cfg
#
# Ghost-call / SIP-scanning defense using Kamailio's pike module.
#
# "Ghost calls" here covers two related abuse patterns hitting a public
# SIP edge:
#   1. Scanning bots sending bursts of INVITE/REGISTER to enumerate valid
#      extensions (most never get a real human on the line)
#   2. One-ring "ghost"/wangiri-style calls designed to bait a callback to
#      a premium-rate number
#
# pike.so tracks request rate per source IP and auto-blocks anything that
# crosses a burst threshold, before it reaches usrloc or a tenant's
# dialplan at all.

loadmodule "pike.so"

modparam("pike", "sampling_time_unit", 2)   # 2-second sampling window
modparam("pike", "reqs_density_per_unit", 30) # >30 requests/2s from one IP = flagged
modparam("pike", "remove_latency", 120)       # auto-unblock after 2 minutes

request_route {
    if (!pike_check_req()) {
        xlog("L_ALERT", "PIKE: flooding detected from $si, blocking\n");
        # Drop straight to the shared ipban hash table used in
        # kamailio-sbc-router's kamailio.cfg, so the block applies
        # consistently across the whole routing layer.
        $sht(ipban=>$si) = 1;
        exit;
    }
    # ... normal routing continues (see kamailio-sbc-router/etc/kamailio.cfg)
}
